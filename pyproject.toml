[project]
name = "torrenthub"
version = "0.1.0"
description = "Hugging Face compatible model mirror that distributes weights over BitTorrent"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx"]

[project.optional-dependencies]
swarm = ["libtorrent"]
mcp = ["mcp>=2"]
dev = ["pytest", "huggingface_hub", "mcp>=2"]

[project.scripts]
torrenthub = "torrenthub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["torrenthub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
