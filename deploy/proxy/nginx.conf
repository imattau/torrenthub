# TLS for a hub. Only HTTP goes through the proxy: the swarm port (TCP and UDP 6881) is not proxied.
server {
    listen 443 ssl;
    http2 on;
    server_name hub.example.org;
    ssl_certificate     /etc/letsencrypt/live/hub.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.org/privkey.pem;

    client_max_body_size 80m;     # a publication is up to THUB_PUBLISH_MAX_BODY (64M) plus encoding
    proxy_buffering off;          # stream big downloads instead of spooling them to disk
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
