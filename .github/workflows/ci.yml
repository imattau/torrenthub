# Written to run the same checks that were run by hand. It has NOT been run on GitHub yet: the first run may need adjusting.
# Actions are pinned by tag, not by commit; pin them by commit before relying on this for anything that matters.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # Mondays: the lock files go stale, so audit them on a timer

jobs:
  test:
    runs-on: ubuntu-24.04     # git 2.43
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c lock/dev.txt -e ".[swarm,mcp,relay,fast,dev]"
      - run: git config --global user.email ci@example.org && git config --global user.name ci
      - run: python -m pytest -q -p no:cacheprovider -rf    # about 10 minutes

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sh deploy/smoke-test.sh      # builds the wheel, installs it at the locked versions into a clean virtualenv, starts it, probes it

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Containerfile -t torrenthub .
      - run: |
          docker run -d --name hub -p 8080:8080 -p 6881:6881 -p 6881:6881/udp -e THUB_PUBLIC_URL=http://127.0.0.1:8080 torrenthub
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/thub/info
          docker exec hub torrenthub doctor --probe || true
          docker exec hub id -u | grep -qx 10001

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit -r lock/runtime.txt --no-deps
      - run: pip-audit -r lock/dev.txt --no-deps
